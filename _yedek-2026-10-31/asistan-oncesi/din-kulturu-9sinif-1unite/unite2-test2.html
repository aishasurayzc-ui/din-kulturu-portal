<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2. Ünite — Test 2 | İslam'da İnanç Esasları</title>
<style>
:root{
  --ink:#17242e; --ink2:#41525f; --bg:#f6f4ef; --card:#ffffff;
  --line:#e3ddd2; --teal:#0f6f66; --teal-soft:#e6f2f0;
  --blue:#1e5a8a; --blue-soft:#e8f1f8;
  --green:#3c6b2f; --green-soft:#ecf4e8;
  --red:#a33a34; --red-soft:#fbeceb;
  --amber:#a4610b; --amber-soft:#fbf1e2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}
a{color:var(--teal)}
header.hero{background:linear-gradient(160deg,#0f6f66 0%,#134e5e 60%,#173a4a 100%);color:#fff;padding:34px 20px 30px;margin-bottom:22px}
header.hero .inner{max-width:760px;margin:0 auto}
.kicker{letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;opacity:.82;margin:0 0 8px}
header.hero h1{margin:0 0 8px;font-size:clamp(21px,4vw,28px)}
header.hero p{margin:0;opacity:.92;font-size:14.5px}
.zortag{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.top-back{max-width:760px;margin:14px auto 0;padding:0 20px}
.top-back a{display:inline-flex;gap:6px;color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:650}
.quiz-q{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:14px 0}
.quiz-q .qh{font-weight:650;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start}
.quiz-q .qn{background:var(--blue);color:#fff;border-radius:7px;padding:1px 9px;font-size:13px;height:fit-content;flex:none;margin-top:2px}
.opt{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:5px 0;cursor:pointer;font-size:15px;transition:.12s}
.opt:hover{background:#f2f7fb;border-color:#b9d3e6}
.opt input{margin-right:8px}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.qexp{display:none;margin-top:10px;padding:10px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 9px 9px 0;font-size:14.4px}
.qexp.show{display:block}
.quiz-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0;background:linear-gradient(180deg,rgba(246,244,239,0),var(--bg) 30%)}
button.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
button.btn:hover{background:#0c5b53}
#score{font-weight:750;font-size:16px;background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:10px}
</style>
</head>
<body>

<div class="top-back"><a href="unite2.html">← Konuya Dön</a></div>

<header class="hero">
  <div class="inner">
    <p class="kicker">Din Kültürü ve Ahlak Bilgisi · 2. Ünite · Test 2/4</p>
    <h1>İslam'da İnanç Esasları — Test 2</h1>
    <p>20 soru · 5 seçenekli · TYT/AYT formatı. Kırmızı etiketli sorular daha zorlayıcıdır.</p>
  </div>
</header>

<div class="wrap">
  <div id="quiz"></div>
  <div class="quiz-bar">
    <button class="btn" id="btnBitir">Sonuçları Gör</button>
    <span id="score"></span>
  </div>
</div>

<script>
const SORULAR = [
{z:0, s:"İman esaslarının tamamı için ortak nitelik olarak, esaslardan birini kabul edip diğerini reddeden kişi için ne söylenir?", o:["Yine de mümin sayılır","İman etmiş sayılmaz çünkü esaslar bir bütündür","Taklidî iman sahibidir","Tahkikî iman sahibidir","İhsan sahibidir"], d:1, a:"İman esasları bölünmez bir bütündür; birini reddeden kişi iman etmiş sayılmaz."},
{z:0, s:"'Bir şey yaratmak istediği zaman O'nun yaptığı Ol! demekten ibarettir' ayetinde vurgulanan sıfat hangisidir?", o:["İlim","Semi'","Tekvîn","Bekā","Vücûd"], d:2, a:"Tekvîn, Allah'ın her şeyi yaratmasını; bu ayet özellikle bu sıfata işaret eder."},
{z:0, s:"Kur'an-ı Kerim'in en uzun suresi ve Bakara 177. ayetin bulunduğu sure hangisidir?", o:["Âl-i İmrân","Nisâ","Bakara","Mâide","Enbiyâ"], d:2, a:"Bakara suresi, Kur'an'ın 2. ve en uzun suresidir."},
{z:0, s:"Peygamberlerin kendilerine vahyedileni hiçbir eksiklik ya da ekleme yapmadan insanlara ulaştırması hangi sıfatla ifade edilir?", o:["Sıdk","Emanet","Tebliğ","Fetanet","İsmet"], d:2, a:"Tebliğ, vahyi eksiksiz ulaştırma sıfatıdır."},
{z:1, s:"Bir ayet, iyiliğin yalnızca namazda yüzü belli bir yöne çevirmekten ibaret olmadığını; iman, ibadet ve ahlakın bütününü kapsadığını vurgular. Bu açıklama hangi ayetle ilgilidir?", o:["Rûm 30/30","Bakara 2/177","İhlâs 112/1-4","Kamer 54/49","Ankebût 29/64"], d:1, a:"Bakara 2/177, 'iyilik yüzünüzü doğu-batıya çevirmeniz değildir' diyerek başlayıp iyiliği iman-ibadet-ahlak bütünü olarak tanımlar."},
{z:0, s:"Zebûr hangi peygambere indirilmiştir?", o:["Hz. Mûsâ","Hz. Dâvûd","Hz. Îsâ","Hz. Süleyman","Hz. İbrahim"], d:1, a:"Zebûr, Hz. Dâvûd'a indirilmiştir."},
{z:0, s:"Kabirde sorgu ile görevli melekler hangileridir?", o:["Kirâmen Kâtibîn","Hafaza melekleri","Münker ve Nekir","Mukarrabûn","Hamele-i Arş"], d:2, a:"Münker ve Nekir, kabirde sorgu ile görevli meleklerdir."},
{z:1, s:"Bir kimse, Kur'an-ı Kerim'i vahiy ürünü kabul ettiği hâlde, bu vahyin bir melek aracılığıyla peygambere ulaştırıldığını reddediyor. Bu tutum hangi iki iman esası arasındaki bağı görmezden gelmektedir?", o:["Allah'a iman - kadere iman","Kitaplara iman - meleklere iman","Peygamberlere iman - ahirete iman","Meleklere iman - ahirete iman","Kadere iman - kitaplara iman"], d:1, a:"Vahiy, Cebrâil (melek) aracılığıyla kitaba dönüşür; kitaplara iman ile meleklere iman bu yüzden birbirine bağlıdır."},
{z:0, s:"Vahdâniyet sıfatının anlamı nedir?", o:["Allah'ın ezelî olması","Allah'ın tek olması, eşi/ortağı olmaması","Allah'ın diri olması","Allah'ın her şeyi bilmesi","Allah'ın her şeye gücünün yetmesi"], d:1, a:"Vahdâniyet, Allah'ın tek olup hiçbir eşi/benzeri/ortağının olmamasıdır."},
{z:0, s:"İslam'ın şartları kaç tanedir ve bunlardan hangisi iman esasları arasında YER ALMAZ?", o:["5 - Hac","6 - Kader","5 - Namaz","6 - Ahiret","5 - Zekât"], d:0, a:"İslam'ın şartları 5 tanedir (kelime-i şehadet, namaz, zekât, oruç, hac); hac bir iman esası değil, İslam'ın şartlarındandır."},
{z:1, s:"'Peygamberler günahtan korunmuş, akıllı ve güvenilir kişilerdir; ancak yeme-içme, evlenme gibi konularda diğer insanlar gibidirler.' Bu ifade hangi ayetle örtüşür?", o:["Ahzâb 33/40","Fussilet 41/6","Hicr 15/9","Enbiyâ 21/25","Nisâ 4/136"], d:1, a:"Fussilet 41/6, peygamberlerin de insan olduğunu bildirir."},
{z:0, s:"Kur'an-ı Kerim'in kıyamete kadar bozulmadan korunacağı hangi ayette bildirilir?", o:["Hicr 15/9","Bakara 2/213","Mâide 5/44","Nisâ 4/163","Ahzâb 33/40"], d:0, a:"Hicr 15/9, 'Onun koruyucusu da elbette biziz' ayetiyle Kur'an'ın korunmuşluğunu bildirir."},
{z:0, s:"Haşir kavramı ne anlama gelir?", o:["İnsanların hesap vermesi","Diriltilen varlıkların hesap için toplanması","Amellerin tartılması","Cennete girmek","Kabir hayatının başlaması"], d:1, a:"Haşir, diriltilen varlıkların hesaba çekilmek üzere toplanmasıdır."},
{z:1, s:"Bir öğrenci, sınavda kimsenin görmediği bir anda kopya çekme imkânı bulmasına rağmen 'Kimse görmese de Allah görüyor' diyerek bundan vazgeçiyor. Bu davranış imanın hangi kazanımına doğrudan örnektir?", o:["İmanın topluma kazandırdığı adalet","İmanın bireye kazandırdığı ahlaki süreklilik (takva)","Kader inancı","Meleklere iman","Peygamberlere iman"], d:1, a:"Ahiret bilinciyle gelişen 'her an gözetlendiği' farkındalığı (takva), imanın bireyde ahlakı süreklileştirmesinin anahtar mekanizmasıdır."},
{z:0, s:"Aşağıdakilerden hangisi selbî sıfatlardandır?", o:["Kudret","İrade","Muhâlefetün li'l-havâdis","Kelâm","Semi'"], d:2, a:"Muhâlefetün li'l-havâdis, Allah'ın yaratılmışlara benzememesini bildiren selbî bir sıfattır."},
{z:0, s:"'Antlaşma yaptığı zaman sözünü tutmak' Bakara 177'de birr'in hangi boyutuna girer?", o:["İman","İbadet","Sosyal ahlak","Bireysel ahlak","Tevekkül"], d:2, a:"Ahde vefa (sözünde durma), ayette sosyal ahlak boyutuna örnek verilir."},
{z:1, s:"Bir ayet; imanı, ibadeti, sözünde durmayı ve zorluklarda sabretmeyi tek bir çerçevede birleştirerek bunları taşıyanları 'sâdıklar' ve 'müttakiler' olarak niteler. Anlatılan ayet aşağıdakilerden hangisidir?", o:["İhlâs 112","Bakara 2/177","Rûm 30/30","Kamer 54/49","Enfâl 8/2"], d:1, a:"Bakara 2/177, saydığı vasıfları taşıyanları sâdıklar ve müttakiler olarak niteleyerek sona erer."},
{z:0, s:"Mucize kavramı için hangi tanım doğrudur?", o:["Meleklerin insan suretinde görünmesi","Peygamberlerin nübüvvetlerini inkâr edenlere karşı Allah'ın izniyle gösterdiği olağanüstü olay","Kader ile kazanın birleşmesi","Vahyin kitaba dönüşmesi","Tevekkülün bir sonucu"], d:1, a:"Mucize, peygamberlerin nübüvvetini inkâr edenlere karşı Allah'ın izniyle gerçekleşen, akıl ve alışılmışın sınırlarını aşan olaydır."},
{z:0, s:"Sûra ilk üflenişle gerçekleşen olay hangisidir?", o:["Haşir","Kıyamet","Ba'sü ba'de'l-mevt","Mizan","Hesap"], d:1, a:"Sûra ilk üfleyişte kıyamet kopar; ikinci üfleyişte diriliş gerçekleşir."},
{z:1, s:"'İman esasları zamana, topluma ve kişiye göre değişmez; herkes için aynı şekilde geçerlidir.' Bu özellik, iman esaslarının hangi niteliğiyle ilgilidir?", o:["Tevhide dayanması","Değişmezlik ve kesinlik","Özgür iradeye dayanma","Sadelik","Bir bütün oluşu"], d:1, a:"İman esaslarının 'değişmez ve kesin olması' özelliği, zaman ve topluma göre değişmediğini ifade eder."}
];

const q = document.getElementById('quiz');
q.innerHTML = SORULAR.map(function(item,i){
  var opts = item.o.map(function(op,j){
    var harf = "ABCDE"[j];
    return '<label class="opt" data-i="'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> <b>'+harf+')</b> '+op+'</label>';
  }).join('');
  return '<div class="quiz-q" data-d="'+item.d+'">'+
    '<div class="qh"><span class="qn">'+(i+1)+'</span><span>'+item.s+(item.z? '<span class="zortag">ZOR</span>':'')+'</span></div>'+
    opts+
    '<div class="qexp">'+item.a+'</div>'+
  '</div>';
}).join('');

document.getElementById('btnBitir').addEventListener('click', function(){
  var qs = document.querySelectorAll('.quiz-q');
  var dogru = 0;
  qs.forEach(function(el){
    var d = parseInt(el.getAttribute('data-d'),10);
    var secili = el.querySelector('input:checked');
    var opts = el.querySelectorAll('.opt');
    opts.forEach(function(o,i){
      if(i===d) o.classList.add('correct');
      if(secili && parseInt(secili.value,10)===i && i!==d) o.classList.add('wrong');
    });
    if(secili && parseInt(secili.value,10)===d) dogru++;
    el.querySelector('.qexp').classList.add('show');
  });
  document.getElementById('score').textContent = 'Sonuç: '+dogru+' / '+qs.length;
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>

</body>
</html>
