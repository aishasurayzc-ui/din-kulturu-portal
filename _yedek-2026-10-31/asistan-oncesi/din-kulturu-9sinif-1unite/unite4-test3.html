<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4. Ünite — Test 3 | İslam'da Ahlak İlkeleri — 9. Sınıf DKAB</title>
<style>
:root{
  --ink:#17242e; --ink2:#41525f; --bg:#f6f4ef; --card:#ffffff;
  --line:#e3ddd2; --teal:#0f6f66; --teal-soft:#e6f2f0;
  --blue:#1e5a8a; --blue-soft:#e8f1f8;
  --green:#2f6b2f; --green-soft:#eaf4ea;
  --red:#a33a34; --red-soft:#fbeceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.62;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:20px 18px 90px}
a.geri{display:inline-block;margin-bottom:14px;font-size:14px;font-weight:650;color:var(--teal);text-decoration:none}
header.hero{background:linear-gradient(160deg,#0f6f66 0%,#134e5e 60%,#173a4a 100%);color:#fff;padding:26px 22px;border-radius:16px;margin-bottom:22px}
header.hero .kicker{letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;opacity:.82;margin:0 0 6px}
header.hero h1{margin:0 0 6px;font-size:22px}
header.hero p{margin:0;opacity:.92;font-size:14px}
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:14px 0}
.quiz-q.hard{border-left:4px solid var(--blue)}
.qh{font-weight:650;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start}
.qn{background:var(--teal);color:#fff;border-radius:7px;padding:1px 9px;font-size:13px;flex:none}
.qh.hard .qn{background:var(--blue)}
.qtag{font-size:11px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 9px;font-weight:700;margin-left:auto;white-space:nowrap}
.qtext{font-size:15.3px}
.opt{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:6px 0 0;cursor:pointer;font-size:15px}
.opt:hover{background:#f4f2ec}
.opt input{margin-right:8px}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.qexp{display:none;margin-top:10px;padding:10px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 9px 9px 0;font-size:14.3px}
.qexp.show{display:block}
.quiz-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:rgba(246,244,239,.95);backdrop-filter:blur(6px);padding:14px 0;border-top:1px solid var(--line);margin-top:10px}
button.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
button.btn:hover{background:#0c5b53}
#score{font-weight:700;font-size:15.5px}
.testnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.testnav a{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink2)}
.testnav a.aktif{background:var(--teal);color:#fff;border-color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <a class="geri" href="unite4.html">← Konuya Dön</a>
  <header class="hero">
    <p class="kicker">9. Sınıf DKAB · 4. Ünite · İslam'da Ahlak İlkeleri</p>
    <h1>Test 3</h1>
    <p>20 soru · 5 seçenekli · TYT/AYT formatında karışık zorlukta test</p>
  </header>
  <div class="testnav">
    <a href="unite4-test1.html">Test 1</a>
    <a href="unite4-test2.html">Test 2</a>
    <a class="aktif" href="unite4-test3.html">Test 3</a>
    <a href="unite4-test4.html">Test 4</a>
  </div>
  <div id="quiz"></div>
  <div class="quiz-bar">
    <button class="btn" onclick="degerlendir()">Sonuçları Gör</button>
    <span id="score"></span>
  </div>
</div>
<script>
const SORULAR = [
{q:"\"İyilik güzel ahlaktır. Kötülük ise içini huzursuz eden ve başkalarının bilmesini istemediğin şeydir.\" hadisinde ahlakın ölçüsü olarak hangi iç duygu işaret edilir?",opts:["Öfke","Vicdan","Kıskançlık","Korku","Gurur"],c:1,exp:"Hadisteki 'içini huzursuz eden' ifadesi doğrudan vicdana işaret eder; vicdan ahlakın iç ölçüsü olarak gösterilir.",hard:false},
{q:"Ahlaka kaynaklık eden unsurlardan 'duygular' hangi işlevi görür?",opts:["Sevgi, sevinç, üzüntü, pişmanlık, öfke gibi hislerle değerler dünyasının kurulmasını sağlar","Yalnızca bedensel ihtiyaçları düzenler","Toplumsal hukuku belirler","Ekonomik ilişkileri yönetir","Yalnızca ibadetleri şekillendirir"],c:0,exp:"Metne göre duygular (sevgi, sevinç, üzüntü, pişmanlık, öfke) insanın değerler dünyasını kurmasında rol oynar.",hard:false},
{q:"İslam ahlakının bireysel amacı için aşağıdakilerden hangisi doğrudur?",opts:["İnsanı toplumdan koparmak","İnsanı güzel ahlaki vasıflarla donatıp manevi bakımdan olgunlaştırmak","Yalnızca maddi zenginlik kazandırmak","Bireyi yalnızlığa itmek","Sadece bedensel sağlığı korumak"],c:1,exp:"Bireysel amaç; insanı güzel ahlaki vasıflarla donatmak ve manevi bakımdan olgunlaştırmaktır.",hard:false},
{q:"Muaz b. Cebel'in Yemen'e vali olarak gönderilirken aldığı tavsiye neydi?",opts:["Vergileri artırması","İnsanlara güzel ahlakla muamele etmesi","Askeri güç kullanması","Ticareti yasaklaması","Sadece kendi kabilesine hizmet etmesi"],c:1,exp:"Hz. Peygamber, Muaz b. Cebel'e insanlara güzel ahlakla muamele etmesini tavsiye etmiştir; bu tavsiye İslam'ın hızla yayılmasına vesile olmuştur.",hard:false},
{q:"\"Müminlerin iman bakımından en mükemmeli, ahlak bakımından en güzel olanıdır.\" hadisinden hareketle aşağıdakilerden hangisi söylenebilir?",opts:["İman ile ahlak birbirinden tamamen bağımsız iki alandır.","İmanın olgunluğu ile ahlakın güzelliği arasında doğrudan bir ilişki vardır.","Ahlak yalnızca toplumsal bir mesele olup imanla ilgisi yoktur.","Bu hadis yalnızca ibadetlerin sayısını konu alır.","Ahlaksız bir mümin, iman bakımından en mükemmel kabul edilir."],c:1,exp:"Hadis, iman olgunluğu ile ahlak güzelliğini doğrudan ilişkilendirir; imanı en mükemmel olanın aynı zamanda ahlakça en güzel olduğunu bildirir.",hard:true},
{q:"'İtidal' kavramı hangi erdemle aynı kökten gelir?",opts:["Şecaat","Adalet","Hikmet","İffet","Sabır"],c:1,exp:"İtidal, duygu, düşünce ve davranışlarda dengeli olmaktır ve adalet ile aynı kökten gelir.",hard:false},
{q:"\"Seni Allah yolunda öldürecektim; sen yüzüme tükürünce nefsim öfke duydu. O hâlde öldürseydim Allah için değil nefsim için öldürmüş olacaktım.\" (Hz. Ali) Bu kıssadan çıkarılabilecek en uygun sonuç nedir?",opts:["Cesaret gösterisi her zaman doğrudur.","Şecaat, nefsin öfkesiyle değil hak adına gösterilmelidir.","Düşmana asla merhamet gösterilmemelidir.","Savaşta hiçbir kural gözetilmez.","Öfke, doğru bir eylemin tek sebebidir."],c:1,exp:"Hz. Ali, eylemin Allah rızası için değil nefsinin öfkesi için yapılacağını fark edince vazgeçmiştir; şecaat hak adına gösterilmelidir, nefsin öfkesiyle değil.",hard:true},
{q:"İffet erdeminin iki aşırı ucu nedir?",opts:["Cimrilik – savurganlık","Bütün dünyevi nimetlerden el çekme – gücünü sadece hazlar için tüketme","Korkaklık – saldırganlık","Cahillik – bağnazlık","Kibir – zillet"],c:1,exp:"İffetin iki aşırı ucu, tüm dünyevi nimetlerden el çekmek ile gücü yalnızca hazlar için tüketmektir; orta yol iffettir.",hard:false},
{q:"Hikmetli kişi, dinin emir ve yasaklarına karşı nasıl bir tutum geliştirir?",opts:["Sorgulamadan sadece taklit eder","İlahi maksadı anlamaya çalışarak kulluğunu güzelleştirir","Emir ve yasakları önemsiz görür","Yalnızca cezadan korkarak uyar","Din ile aklı birbirinden tamamen ayırır"],c:1,exp:"Hikmetli kişi, dinin emir ve yasaklarındaki ilahi maksadı anladıkça kulluğu da güzelleşir.",hard:false},
{q:"Bir öğrenci, sınavda kopya çeken arkadaşını gördüğü hâlde, arkadaşlık ilişkisi bozulmasın diye öğretmene hiçbir şey söylemiyor. Bu davranış, ünitede işlenen hangi erdemin ihmaliyle en çok ilişkilidir?",opts:["İffet","Şecaat ve dürüstlük","Hikmet","Sabır","Adabımuaşeret"],c:1,exp:"Doğruyu bilip söylememek hem dürüstlüğe (sıdk) hem de gerçeği açıklama cesaretine, yani şecaate aykırıdır.",hard:true},
{q:"Ticarette dürüstlüğün gerekleri arasında aşağıdakilerden hangisi sayılmaz?",opts:["Ölçü ve tartının doğru yapılması","Malın kusurunun gizlenmemesi","İşçinin hakkının gecikmeden ödenmesi","Sözleşmeye uyulması","Kârı artırmak için malın kusurunun saklanması"],c:4,exp:"Metinde malın kusurunun gizlenmemesi gerektiği açıkça belirtilir; kusuru saklamak dürüstlükle çelişir.",hard:false},
{q:"Vakıfların ortaya çıkışıyla ilgili aşağıdakilerden hangisi doğrudur?",opts:["Vakıflar İslam'daki infak emrinin bir sonucu olarak ortaya çıkmıştır","Vakıflar yalnızca devlet eliyle kurulabilir","Vakıflar yardımlaşma kültürüyle ilgisizdir","Vakıflar sadece cami inşası için kurulmuştur","Vakıflar modern dönemde ortaya çıkmıştır"],c:0,exp:"Metne göre İslam'daki infak emri, Müslümanlar arasında vakıf adı verilen kurumların ortaya çıkmasını sağlamıştır.",hard:false},
{q:"Sabrın 'ibadette ve kaçınmada' gösterilen türüne hangisi örnektir?",opts:["Hastalık karşısında metin olmak","Emirleri yerine getirirken devamlılık göstermek, yasaklardan uzak durmak","Öfkeye hâkim olmak","Haksız suçlamaya sabretmek","Kayıp karşısında ümitsizliğe kapılmamak"],c:1,exp:"İbadette ve kaçınmada sabır; emirleri yerine getirirken kararlılık göstermeyi ve yasaklardan uzak durmayı ifade eder.",hard:false},
{q:"Adabımuaşeret örnekleri arasında aşağıdakilerden hangisi sayılmaz?",opts:["Selamlaşmak","Davete icabet etmek","Sofra adabına dikkat etmek","İsterken ısrarcı olmak","Konuşanı dinlemek"],c:3,exp:"Metinde 'isterken ısrarcı olmamak' bir adap kuralı olarak sayılır; 'ısrarcı olmak' bunun tersidir ve sayılmaz.",hard:false},
{q:"Sofrada besmele çekmek, sağ elle yemek ve nezakete dikkat etmek hangi kavramla ilişkilidir?",opts:["Adabımuaşeret","Şecaat","Hikmet","Zekât","İnfak"],c:0,exp:"Sofra adabı, toplumda gelenekleşmiş nezaket ve görgü kuralları olan adabımuaşeretin bir örneğidir.",hard:false},
{q:"İsrâ suresinin 17. sure olduğu ve Mekke'de indiği bilgisinden hareketle aşağıdakilerden hangisi söylenebilir?",opts:["Sure, hicretten sonraki toplumsal düzenlemeleri konu alır","Sure, hicretten önceki dönemde temel ahlaki vazifeleri konu edinir","Sure yalnızca savaş hukukunu içerir","Sure yalnızca miras hukukunu konu alır","Sure Medine'nin fethiyle ilgilidir"],c:1,exp:"İsrâ suresi Mekke döneminde inmiştir ve 23-29. ayetleri İslam'ın hayata hâkim kılmak istediği temel ahlaki vazifeleri konu alır.",hard:false},
{q:"İsrâ 28. ayette, yardım edecek imkânı olmayan kişiden ne istenir?",opts:["Hiçbir şey yapmaması","Hiç değilse rahatlatıcı bir söz söylemesi","Borç alıp yardım etmesi","Sessiz kalması","Yardım isteyeni azarlaması"],c:1,exp:"Ayet, imkânı olmayan kişinin bile hiç değilse rahatlatıcı bir söz söylemesi gerektiğini bildirir; yardımlaşma yalnızca maddi değildir.",hard:false},
{q:"\"Akrabaya, yoksula ve yolda kalmış yolcuya haklarını ver, fakat saçıp savurma.\" (İsrâ 26) ayetiyle 4.2'de işlenen adalet erdemi arasındaki bağlantı için aşağıdakilerden hangisi söylenebilir?",opts:["İkisi arasında hiçbir bağlantı yoktur.","Her ikisi de cömertlik ile savurganlık arasında bir denge kurmayı öğütler.","Ayet yalnızca akrabaları, adalet erdemi yalnızca yabancıları ilgilendirir.","Adalet erdemi ayetle çelişir.","Ayet yalnızca ekonomik konuları, adalet ise yalnızca hukuku ilgilendirir."],c:1,exp:"Aynı ayet 4.2'de adalet erdeminin örneği, 4.4'te İsrâ suresinin mesajı olarak geçer; ikisi de hak vermede ölçülü olmayı, savurganlıktan kaçınmayı öğütler.",hard:true},
{q:"Kavram sözlüğüne göre 'mürüvvet' kavramı neyi ifade eder?",opts:["Kur'an ahlakının başka bir adı","Cahiliye Döneminde ahlak karşılığı kullanılan, kabileye dayalı kavram","Zekâtın bir türü","Hikmetin eş anlamlısı","Adabımuaşeretin diğer adı"],c:1,exp:"Mürüvvet, Cahiliye Döneminde ahlak karşılığı kullanılan ve kabileye dayalı bir kavramdır.",hard:false},
{q:"Bir kişi, hem işinde son derece dürüst hem de ihtiyaç sahiplerine gizlice yardım ediyor; ancak bir haksızlığa şahit olduğunda, başı derde girmesin diye susmayı tercih ediyor. Bu kişinin eksik olduğu erdem hangisidir?",opts:["Dürüstlük","Yardımseverlik","Şecaat","İffet","Hikmet"],c:2,exp:"Kişi dürüstlük ve yardımseverlikte güçlüdür; ancak haksızlık karşısında susması korkaklığa, yani şecaat eksikliğine işaret eder.",hard:true}
];
function render(){
  const el = document.getElementById('quiz');
  el.innerHTML = SORULAR.map(function(s,i){
    const opts = s.opts.map(function(o,j){
      return '<label class="opt" data-i="'+i+'" data-j="'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+o+'</label>';
    }).join('');
    return '<div class="quiz-q'+(s.hard?' hard':'')+'" id="qbox'+i+'">'+
      '<div class="qh'+(s.hard?' hard':'')+'"><span class="qn">'+(i+1)+'</span><span class="qtext">'+s.q+'</span>'+(s.hard?'<span class="qtag">TYT/AYT</span>':'')+'</div>'+
      opts+
      '<div class="qexp" id="qexp'+i+'"><b>Doğru cevap: '+String.fromCharCode(65+s.c)+')</b> '+s.exp+'</div>'+
    '</div>';
  }).join('');
}
function degerlendir(){
  let dogru = 0, cevapsiz = 0;
  SORULAR.forEach(function(s,i){
    const secili = document.querySelector('input[name="q'+i+'"]:checked');
    const secIdx = secili ? parseInt(secili.value,10) : -1;
    if(secIdx === -1) cevapsiz++;
    else if(secIdx === s.c) dogru++;
    document.querySelectorAll('label[data-i="'+i+'"]').forEach(function(lbl){
      const j = parseInt(lbl.getAttribute('data-j'),10);
      if(j === s.c) lbl.classList.add('correct');
      else if(j === secIdx) lbl.classList.add('wrong');
    });
    document.getElementById('qexp'+i).classList.add('show');
  });
  document.getElementById('score').textContent = 'Sonuç: '+dogru+' / '+SORULAR.length+' doğru'+(cevapsiz?' ('+cevapsiz+' boş)':'');
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
