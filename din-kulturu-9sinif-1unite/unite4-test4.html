<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4. Ünite — Test 4 | İslam'da Ahlak İlkeleri — 9. Sınıf DKAB</title>
<style>
:root{
  --ink:#17242e; --ink2:#41525f; --bg:#f6f4ef; --card:#ffffff;
  --line:#e3ddd2; --teal:#0f6f66; --teal-soft:#e6f2f0;
  --blue:#1e5a8a; --blue-soft:#e8f1f8;
  --green:#2f6b2f; --green-soft:#eaf4ea;
  --red:#a33a34; --red-soft:#fbeceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.62;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:20px 18px 90px}
a.geri{display:inline-block;margin-bottom:14px;font-size:14px;font-weight:650;color:var(--teal);text-decoration:none}
header.hero{background:linear-gradient(160deg,#0f6f66 0%,#134e5e 60%,#173a4a 100%);color:#fff;padding:26px 22px;border-radius:16px;margin-bottom:22px}
header.hero .kicker{letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;opacity:.82;margin:0 0 6px}
header.hero h1{margin:0 0 6px;font-size:22px}
header.hero p{margin:0;opacity:.92;font-size:14px}
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:14px 0}
.quiz-q.hard{border-left:4px solid var(--blue)}
.qh{font-weight:650;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start}
.qn{background:var(--teal);color:#fff;border-radius:7px;padding:1px 9px;font-size:13px;flex:none}
.qh.hard .qn{background:var(--blue)}
.qtag{font-size:11px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 9px;font-weight:700;margin-left:auto;white-space:nowrap}
.qtext{font-size:15.3px}
.opt{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:6px 0 0;cursor:pointer;font-size:15px}
.opt:hover{background:#f4f2ec}
.opt input{margin-right:8px}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.qexp{display:none;margin-top:10px;padding:10px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 9px 9px 0;font-size:14.3px}
.qexp.show{display:block}
.quiz-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:rgba(246,244,239,.95);backdrop-filter:blur(6px);padding:14px 0;border-top:1px solid var(--line);margin-top:10px}
button.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
button.btn:hover{background:#0c5b53}
#score{font-weight:700;font-size:15.5px}
.testnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.testnav a{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink2)}
.testnav a.aktif{background:var(--teal);color:#fff;border-color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <a class="geri" href="unite4.html">← Konuya Dön</a>
  <header class="hero">
    <p class="kicker">9. Sınıf DKAB · 4. Ünite · İslam'da Ahlak İlkeleri</p>
    <h1>Test 4</h1>
    <p>20 soru · 5 seçenekli · TYT/AYT formatında karışık zorlukta test</p>
  </header>
  <div class="testnav">
    <a href="unite4-test1.html">Test 1</a>
    <a href="unite4-test2.html">Test 2</a>
    <a href="unite4-test3.html">Test 3</a>
    <a class="aktif" href="unite4-test4.html">Test 4</a>
  </div>
  <div id="quiz"></div>
  <div class="quiz-bar">
    <button class="btn" onclick="degerlendir()">Sonuçları Gör</button>
    <span id="score"></span>
  </div>
</div>
<script>
const SORULAR = [
{q:"Ahlaki nitelikler bir kişide ne zaman kalıcı hâle gelmiş sayılır?",opts:["Yalnızca bir kez sergilendiğinde","Samimiyet (ihlas) ve süreklilik arz ettiğinde","Başkaları tarafından övüldüğünde","Yasalarla zorlandığında","Kişi çıkar sağladığında"],c:1,exp:"Metne göre ahlaki nitelikler ancak samimiyet ve süreklilik arz ettiğinde kişide yer etmiş ve onun ahlakı hâline gelmiş sayılır.",hard:false},
{q:"İhlas ilkesine göre kişi doğru olanı yaparken neyi gözetmelidir?",opts:["Başkalarının övgüsünü","Yalnızca Allah'ın rızasını","Toplumsal itibarını","Maddi kazancını","Ailesinin baskısını"],c:1,exp:"İhlas; kişinin başkalarının övgü ve yergisini önemsemeden yalnızca Allah'ın rızasını gözetmesidir.",hard:false},
{q:"Kur'an ahlakının cahiliye ahlakına (mürüvvet) göre kapsam farkı nedir?",opts:["Kur'an ahlakı yalnızca kabile içi ilişkileri kapsar","Kur'an ahlakı Rab, insanlar, diğer canlılar ve çevreyi kapsayan evrensel ilkelere sahiptir","İkisinin kapsamı birebir aynıdır","Cahiliye ahlakının kapsamı daha geniştir","Kur'an ahlakının hiçbir kapsamı yoktur"],c:1,exp:"Cahiliye ahlakı kabile içi ilişkilerle sınırlıyken, Kur'an ahlakı Rab, insanlar, diğer canlılar ve çevre ile ilişkiyi kapsayan evrensel ilkelere dayanır.",hard:false},
{q:"\"Ant olsun, Allah'ın Resulü'nde sizin için... güzel bir örnek vardır.\" (Ahzâb 33/21) ayetiyle ilgili aşağıdakilerden hangisi söylenemez?",opts:["Hz. Peygamber müminler için örnek bir şahsiyettir.","Bu örneklik, Allah'a ve ahiret gününe iman edenler için anlamlıdır.","Ayet, Hz. Peygamber'i zikirle ilişkilendirir.","Örneklik yalnızca ibadet biçimleriyle sınırlıdır.","Ayet Hz. Peygamber'in ahlaki şahsiyetine vurgu yapar."],c:3,exp:"Ünite boyunca Hz. Peygamber'in örnekliği hem ibadet hem ahlaki tutum ve davranışları kapsayan bütüncül bir örnekliktir; 'yalnızca ibadet biçimleriyle sınırlı' ifadesi bu bütünlüğü daraltır ve metinle çelişir.",hard:true},
{q:"\"Sen elbette yüce bir ahlak üzeresin.\" (Kalem 68/4) ayetinin ünitedeki işleviyle ilgili aşağıdakilerden hangisi doğrudur?",opts:["İslam ahlakının Hz. Muhammed'in şahsında somutlaştığını gösteren kanıtlardan biridir.","Ahlakın soyut bir kavram olduğunu kanıtlar.","Ayet yalnızca Mekke döneminin ekonomik yapısını anlatır.","Ayet ahlakı yalnızca bireysel bir mesele olarak sunar.","Ayetin ahlak konusuyla ilgisi yoktur."],c:0,exp:"Bu ayet, İslam ahlakının teorik değil Hz. Muhammed'in şahsiyetinde somutlaşan bir ahlak olduğunu gösteren temel delillerden biri olarak sunulur.",hard:false},
{q:"Dört temel erdemden hangisi 'aklın güdüleri yönetmesi' ile ilişkilendirilir?",opts:["Adalet","Şecaat","İffet","Hikmet","Sabır"],c:3,exp:"Tabloya göre hikmet, aklın güdüleri yönetmesiyle ilişkilendirilen erdemdir.",hard:false},
{q:"Dört erdem arasındaki ilişkiyi özetleyen ifadeye göre 'şecaat' hangi işlevi görür?",opts:["Bedenî ihtiyaçları meşru ölçüde karşılar","Adaleti sağlamada ve iyiliği yaymada cesaret verir","Aklın güdüleri kontrol etmesini sağlar","Yalnızca ekonomik dengeyi kurar","Toplumsal statüyü belirler"],c:1,exp:"Özet ilişkiye göre şecaat, adaleti sağlamada ve iyiliği yaymada cesaret veren erdemdir.",hard:false},
{q:"Bir yönetici, kendi çıkarına aykırı olsa bile doğru bilgiyi kamuoyuyla paylaşmaktan çekinmiyor; ancak bu bilgiyi paylaşırken üslubunu kontrol edemeyip herkese sertçe hakaret ediyor. Bu yöneticinin durumu hangi erdem çiftinin bir arada tam gerçekleşmediğini gösterir?",opts:["Adalet tam, şecaat aşırı uca (saldırganlığa) kaymış","İffet tam, hikmet eksik","Sabır tam, adalet eksik","Hikmet tam, iffet aşırı uca kaymış","Şecaat eksik, adalet aşırı uca kaymış"],c:0,exp:"Doğru bilgiyi çekinmeden paylaşmak adalet ve dürüstlüğe uygundur; ancak hakaret içeren üslup şecaatin aşırı ucu olan saldırganlığa kaymayı gösterir.",hard:true},
{q:"Yardımseverliğin yollarından 'karz-ı hasen' ne anlama gelir?",opts:["Zorunlu vergi","Faizli borç verme","Karşılıksız/faizsiz borç verme","Miras paylaşımı","Ticari ortaklık"],c:2,exp:"Karz-ı hasen, karşılıksız ve faizsiz borç vermeyi ifade eder; hibe ile birlikte yardımseverliğin yollarından sayılır.",hard:false},
{q:"\"Ey iman edenler! Allah'a ve ahiret gününe inanmadığı hâlde malını insanlara gösteriş yapmak için harcayan kimse gibi sadakalarınızı başa kakmak ve incitmek suretiyle boşa çıkarmayın.\" (Bakara 2/264) ayetinden hangisi çıkarılamaz?",opts:["Gösteriş için yapılan harcama, gerçek bir sadaka sayılmaz.","Sadakayı başa kakmak, onun manevi değerini boşa çıkarabilir.","İyilik yaparken karşıdakini incitmemek gerekir.","Bu ayet yalnızca zenginleri ilgilendirir, herkesi bağlamaz.","İyiliğin şekli kadar niyet ve üslubu da önemlidir."],c:3,exp:"Ayet, iyilik yapan herkese seslenir ('Ey iman edenler'); 'yalnızca zenginleri ilgilendirir' ifadesi metnin evrensel hitabını daraltır ve çıkarılamaz.",hard:true},
{q:"Zekâtın toplumsal boyutuyla ilgili aşağıdakilerden hangisi doğrudur?",opts:["Zekât yalnızca bireysel arınma sağlar, toplumla ilgisi yoktur","Zekât gelir dengesizliğinin giderilmesine ve toplumsal adalete katkı sağlar","Zekât toplumda eşitsizliği artırır","Zekât yalnızca sembolik bir ibadettir","Zekât toplumsal hayatı hiç etkilemez"],c:1,exp:"Zekâtın toplumsal yönü; gelir dengesizliğinin giderilmesi ve toplumsal adaletin sağlanmasıdır.",hard:false},
{q:"Sabrın 'dıştan gelen zorluklara' gösterilen türüne örnek olarak metinde ne verilir?",opts:["Öfkeye hâkim olmak","Hastalık, kayıp, musibet karşısında metin olmak","İbadette devamlılık göstermek","Aşırı istekleri kontrol etmek","Yasaklardan uzak durmak"],c:1,exp:"Dıştan gelen zorluklara sabır; hastalık, kayıp, musibet ve haksız suçlama karşısında metin olmayı, ümitsizliğe kapılmamayı ifade eder.",hard:false},
{q:"Ahilikte bir kişinin meslekten atılmasına yol açan davranışlar arasında aşağıdakilerden hangisi yoktur?",opts:["İçki","Zina","Yalan","Cömertlik","Hile"],c:3,exp:"Meslekten atılmayı gerektiren davranışlar içki, zina, yalan, gıybet ve hiledir; cömertlik ise ahide aranan bir vasıftır, atılma sebebi değildir.",hard:false},
{q:"\"Rabbin sadece kendisine kulluk etmenizi ve anne babanıza iyi davranmanızı emretti.\" ifadesindeki 'sadece' kelimesi kime yöneliktir?",opts:["Anne babaya iyilik etmeye","Yalnızca Allah'a kulluğa, başka hiçbir varlığa kulluk edilmemesine","Yalnızca ibadet biçimlerine","Toplumsal kurallara","Ailevi sorumluluklara"],c:1,exp:"'Sadece kendisine kulluk' ifadesi tevhit vurgusudur; kulluğun yalnızca Allah'a yapılması gerektiğini bildirir.",hard:false},
{q:"İsrâ 24. ayette geçen dua örneğinin içeriği nedir?",opts:["Maddi zenginlik istemek","Anne babaya, küçüklükte gösterdikleri şefkate karşılık merhamet dilemek","Uzun ömür istemek","Toplumsal itibar istemek","Yalnızca kendisi için bağışlanma istemek"],c:1,exp:"Dua, anne babanın küçüklükte gösterdiği şefkatli terbiyeye karşılık, Allah'tan onlara merhamet göstermesini diler.",hard:false},
{q:"İsrâ 23-29. ayetlerin bütününe bakıldığında vazife alanlarının sırasıyla kapsadığı ilişkiler nelerdir?",opts:["Yalnızca Allah ile kul arasındaki ilişki","Allah, anne baba, kendi benliği, akraba-yoksul-yolcu ve mal ile ilişki","Yalnızca akraba ilişkileri","Yalnızca ekonomik ilişkiler","Yalnızca toplumsal statü ilişkileri"],c:1,exp:"Özet tabloya göre ayetler sırasıyla Allah'a, anne babaya, kendine, akraba-yoksul-yolcuya ve mala karşı vazifeleri kapsar.",hard:false},
{q:"\"...Ant olsun ki sizi biraz korku ve açlıkla; mallardan, canlardan ve ürünlerden eksiltmekle sınayacağız. Sabredenleri müjdele!\" (Bakara 2/155) ayeti sabırla ilgili hangi mesajı verir?",opts:["Sabır yalnızca zenginler için gereklidir.","Sınav ve zorluklar hayatın bir parçasıdır; sabredenler müjdelenir.","Zorluklar yalnızca günahkârların başına gelir.","Sabır göstermek gereksizdir.","Zorluklara sabretmek imanla ilgisizdir."],c:1,exp:"Ayet, korku, açlık ve kayıpların bir imtihan olduğunu, bunlara sabredenlerin müjdelendiğini bildirir.",hard:false},
{q:"Bir öğrenci, ailesiyle arasında geçen özel bir sorunu herkese anlatan arkadaşının bu davranışını sosyal medyada eleştirirken, kendisi de başka bir arkadaşının mahrem bir sırrını gruba anlatıyor. Bu öğrencinin tutumu ünitede işlenen hangi erdem ile en çok çelişir?",opts:["Yalnızca hikmetle","Dürüstlük ve tutarlılıkla; kendi savunduğu ilkeye kendisi uymaz","Yalnızca sabırla","Yalnızca adaletle","Yalnızca iffetle"],c:1,exp:"Dürüstlüğün şartlarından biri tutarlılıktır; başkasını eleştirdiği davranışı kendisinin de yapması, tutarlılık ve dürüstlükle çelişir.",hard:true},
{q:"Ünitenin tek cümlelik özetine göre İslam ahlakının kaynağı, ölçüsü ve örneği nedir?",opts:["Kaynağı toplum, ölçüsü gelenek, örneği filozoflar","Kaynağı Allah, ölçüsü Kur'an ve sünnet, örneği Hz. Muhammed (sav)","Kaynağı akıl, ölçüsü kanunlar, örneği devlet başkanları","Kaynağı duygular, ölçüsü kişisel tercih, örneği ünlüler","Kaynağı ekonomi, ölçüsü kâr, örneği tüccarlar"],c:1,exp:"Ünite özetine göre İslam ahlakının kaynağı Allah, ölçüsü Kur'an ve sünnet, en güzel örneği ise Hz. Muhammed'dir (sav).",hard:false}
];
function render(){
  const el = document.getElementById('quiz');
  el.innerHTML = SORULAR.map(function(s,i){
    const opts = s.opts.map(function(o,j){
      return '<label class="opt" data-i="'+i+'" data-j="'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+o+'</label>';
    }).join('');
    return '<div class="quiz-q'+(s.hard?' hard':'')+'" id="qbox'+i+'">'+
      '<div class="qh'+(s.hard?' hard':'')+'"><span class="qn">'+(i+1)+'</span><span class="qtext">'+s.q+'</span>'+(s.hard?'<span class="qtag">TYT/AYT</span>':'')+'</div>'+
      opts+
      '<div class="qexp" id="qexp'+i+'"><b>Doğru cevap: '+String.fromCharCode(65+s.c)+')</b> '+s.exp+'</div>'+
    '</div>';
  }).join('');
}
function degerlendir(){
  let dogru = 0, cevapsiz = 0;
  SORULAR.forEach(function(s,i){
    const secili = document.querySelector('input[name="q'+i+'"]:checked');
    const secIdx = secili ? parseInt(secili.value,10) : -1;
    if(secIdx === -1) cevapsiz++;
    else if(secIdx === s.c) dogru++;
    document.querySelectorAll('label[data-i="'+i+'"]').forEach(function(lbl){
      const j = parseInt(lbl.getAttribute('data-j'),10);
      if(j === s.c) lbl.classList.add('correct');
      else if(j === secIdx) lbl.classList.add('wrong');
    });
    document.getElementById('qexp'+i).classList.add('show');
  });
  document.getElementById('score').textContent = 'Sonuç: '+dogru+' / '+SORULAR.length+' doğru'+(cevapsiz?' ('+cevapsiz+' boş)':'');
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
