<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2. Ünite — Test 1 | İslam'da İnanç Esasları</title>
<style>
:root{
  --ink:#17242e; --ink2:#41525f; --bg:#f6f4ef; --card:#ffffff;
  --line:#e3ddd2; --teal:#0f6f66; --teal-soft:#e6f2f0;
  --blue:#1e5a8a; --blue-soft:#e8f1f8;
  --green:#3c6b2f; --green-soft:#ecf4e8;
  --red:#a33a34; --red-soft:#fbeceb;
  --amber:#a4610b; --amber-soft:#fbf1e2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}
a{color:var(--teal)}
header.hero{background:linear-gradient(160deg,#0f6f66 0%,#134e5e 60%,#173a4a 100%);color:#fff;padding:34px 20px 30px;margin-bottom:22px}
header.hero .inner{max-width:760px;margin:0 auto}
.kicker{letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;opacity:.82;margin:0 0 8px}
header.hero h1{margin:0 0 8px;font-size:clamp(21px,4vw,28px)}
header.hero p{margin:0;opacity:.92;font-size:14.5px}
.zortag{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.top-back{max-width:760px;margin:14px auto 0;padding:0 20px}
.top-back a{display:inline-flex;gap:6px;color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:650}
.quiz-q{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:14px 0}
.quiz-q .qh{font-weight:650;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start}
.quiz-q .qn{background:var(--blue);color:#fff;border-radius:7px;padding:1px 9px;font-size:13px;height:fit-content;flex:none;margin-top:2px}
.opt{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:5px 0;cursor:pointer;font-size:15px;transition:.12s}
.opt:hover{background:#f2f7fb;border-color:#b9d3e6}
.opt input{margin-right:8px}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.qexp{display:none;margin-top:10px;padding:10px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 9px 9px 0;font-size:14.4px}
.qexp.show{display:block}
.quiz-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0;background:linear-gradient(180deg,rgba(246,244,239,0),var(--bg) 30%)}
button.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
button.btn:hover{background:#0c5b53}
#score{font-weight:750;font-size:16px;background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:10px}
</style>
</head>
<body>

<div class="top-back"><a href="unite2.html">← Konuya Dön</a></div>

<header class="hero">
  <div class="inner">
    <p class="kicker">Din Kültürü ve Ahlak Bilgisi · 2. Ünite · Test 1/4</p>
    <h1>İslam'da İnanç Esasları — Test 1</h1>
    <p>20 soru · 5 seçenekli · TYT/AYT formatı. Kırmızı etiketli sorular daha zorlayıcıdır.</p>
  </div>
</header>

<div class="wrap">
  <div id="quiz"></div>
  <div class="quiz-bar">
    <button class="btn" id="btnBitir">Sonuçları Gör</button>
    <span id="score"></span>
  </div>
</div>

<script>
const SORULAR = [
{z:0, s:"İmanın, kalp ile tasdik edilmesinin yanı sıra dil ile de ifade edilmesine ne ad verilir?", o:["Tasdik","İkrar","Amel","Takva","Şirk"], d:1, a:"İkrar, kalpteki imanın söz ile açıklanmasıdır; kişinin mümin olarak bilinmesi ve ona göre muamele görmesi için gereklidir."},
{z:0, s:"Peygamberlerin doğru sözlü olması ve asla yalan söylememesi hangi sıfatla ifade edilir?", o:["Emanet","Fetanet","Sıdk","Tebliğ","İsmet"], d:2, a:"Sıdk, peygamberlerin doğruluk ve dürüstlük sıfatıdır."},
{z:0, s:"Aşağıdakilerden hangisi sübûtî sıfatlardan biri DEĞİLDİR?", o:["İlim","Semi'","Vahdâniyet","Kudret","Kelâm"], d:2, a:"Vahdâniyet selbî (tenzîhî) sıfatlardandır; Allah'ın tek olup eşi/benzeri olmadığını, yani 'ne olmadığını' bildirir."},
{z:0, s:"Kur'an'da 'ölüm meleği' olarak bahsedilen, eceli gelenlerin ruhunu almakla görevli melek aşağıdakilerden hangisidir?", o:["Cebrâil","Mîkâil","İsrâfil","Azrâil","Münker"], d:3, a:"Azrâil, eceli gelen canlıların ruhunu almakla görevlidir."},
{z:1, s:"Bir öğrenci, inandığı esasları hiç araştırmamış; ailesinden gördüğü gibi inanmakta ve bir itirazla karşılaştığında ne diyeceğini bilememektedir. Bu öğrencinin iman durumu için aşağıdakilerden hangisi söylenebilir?", o:["İmanı, delile dayanmadığı için geçersizdir","Tahkikî bir imana sahiptir","Taklidî bir imana sahiptir; bu geçersiz olmasa da şüpheye açıktır","Mümin sayılmaz","İman-amel ilişkisini tam kurmuştur"], d:2, a:"Araştırmadan, çevresini taklit ederek inanmak taklidî imandır. Taklidî iman geçersiz değildir ama itirazlar karşısında sarsılmaya daha açıktır."},
{z:0, s:"Tevrat hangi peygambere indirilmiştir?", o:["Hz. Dâvûd","Hz. Mûsâ","Hz. Îsâ","Hz. İbrahim","Hz. Muhammed"], d:1, a:"Tevrat, Hz. Mûsâ'ya indirilmiştir."},
{z:0, s:"Aşağıdakilerden hangisi meleklerin özelliklerinden biri DEĞİLDİR?", o:["Nurdan yaratılmışlardır","Yorulma, uyuma gibi özelliklerden uzaktırlar","Gaybı bilirler","Allah'ın emirlerine isyan etmezler","Allah'ın izniyle insan suretinde görünebilirler"], d:2, a:"Melekler gaybı bilemezler; bu, sınavda en sık sorulan tuzaklardan biridir."},
{z:1, s:"'Bu varlıklar duyularla algılanamaz, Allah'ın emirlerini eksiksiz yerine getirir; ancak gaybı bilemezler.' Parçada sözü edilen iman esası aşağıdakilerden hangisidir?", o:["Kitaplara iman","Meleklere iman","Peygamberlere iman","Ahirete iman","Kadere iman"], d:1, a:"Tanımdaki özellikler (nurani varlık, gaybı bilmeme, isyan etmeme) meleklere aittir."},
{z:0, s:"Ahiret hayatının aşamalarından, sûra ikinci kez üflenmesiyle gerçekleşen ve ölülerin yeniden diriltilmesi olan aşama aşağıdakilerden hangisidir?", o:["Kıyamet","Haşir","Ba'sü ba'de'l-mevt","Mizan","Sırat"], d:2, a:"Ba'sü ba'de'l-mevt, sûra ikinci üflenişle Allah'ın ölüleri yeniden diriltmesidir."},
{z:0, s:"Cehennem üzerine kurulacağı bildirilen, üzerinden geçilmesi gereken köprüye ne ad verilir?", o:["Mizan","Sırat","Haşir","Berzah","Arasat"], d:1, a:"Sırat, cehennem üzerine kurulacak köprüdür."},
{z:1, s:"Bir kişi başına gelen bir felaketten sonra 'Zaten kaderimde varmış, tedbir almanın anlamı yoktu' diyerek özensizliğini savunuyor. Bu yaklaşım kader inancıyla ilgili hangi yanlışa örnektir?", o:["Kaderi tamamen inkâr etmek","Kaderi, sorumluluğu ortadan kaldıran bir mazerete dönüştürmek","Kazayı kaderden ayırmak","Allah'ın ilim sıfatını inkâr etmek","Tevekkülü doğru biçimde uygulamak"], d:1, a:"Kader inancı sorumluluğu kaldırmaz; doğru tutum önce gayret ve tedbir, sonra tevekküldür. Kişinin tedbirsizliğini kadere bağlaması yaygın bir yanlış anlamadır."},
{z:0, s:"'Allah'ın yarattıklarını dilediği biçimde var etmesi, meydana gelecek olayları ezelî ilmiyle bilmesi ve takdir etmesi' tanımı hangi kavrama aittir?", o:["Kaza","Kader","Tevekkül","Takva","Tevhit"], d:1, a:"Bu, kaderin tanımıdır; kaza ise bu takdirin vakti gelince gerçekleşmesidir."},
{z:1, s:"Aşağıdakilerden hangisi imanın doğrudan BİREYE değil, TOPLUMA kazandırdıklarından biridir?", o:["Sabır","Tevekkül","İç huzur","Adalet ve toplumsal dayanışmanın güçlenmesi","Cesaret"], d:3, a:"Sabır, tevekkül, iç huzur ve cesaret bireysel kazanımlardandır; adalet ve toplumsal dayanışma imanın topluma kazandırdıkları arasındadır."},
{z:1, s:"Bakara 177. ayette sayılan iman esasları arasında yer ALMAYAN, ancak Cibrîl hadisinde iman esası olarak bildirilen kavram aşağıdakilerden hangisidir?", o:["Allah'a iman","Ahirete iman","Meleklere iman","Kadere iman","Kitaplara iman"], d:3, a:"Bakara 177'de Allah, ahiret, melekler, kitaplar ve peygamberlere iman sayılır; kader ayette zikredilmez, Cibrîl hadisinde altıncı esas olarak yer alır."},
{z:0, s:"Peygamberlerin akıllı, zeki ve ileri görüşlü olmaları hangi sıfatla ifade edilir?", o:["Sıdk","Emanet","Fetanet","Tebliğ","İsmet"], d:2, a:"Fetanet, peygamberlerin üstün akıl ve kavrayış sahibi olmaları sıfatıdır."},
{z:1, s:"'Allah'ın hiçbir şeye ve kimseye ihtiyaç duymaması, buna karşılık bütün varlıkların O'na muhtaç olması' hangi sıfatla ifade edilir?", o:["Vücûd","Kıyâm bi-nefsihî","Bekā","Kıdem","Vahdâniyet"], d:1, a:"Kıyâm bi-nefsihî, Allah'ın varlığı için başkasına muhtaç olmaması, buna karşılık her şeyin O'na muhtaç olmasıdır."},
{z:0, s:"Dört büyük kitaptan, 'müjde, iyi haber' anlamına gelen ve Hz. Îsâ'ya indirilen kitap hangisidir?", o:["Tevrat","Zebûr","İncil","Suhuf","Kur'an-ı Kerim"], d:2, a:"İncil, Hz. Îsâ'ya indirilmiştir ve adı 'iyi haber, müjde' anlamına gelir."},
{z:0, s:"Aşağıdakilerden hangisi Bakara 177. ayette belirtilen 'birr'in dört boyutundan biri DEĞİLDİR?", o:["İman","İbadet","Sosyal ahlak","Bireysel ahlak","Siyasi güç kazanma"], d:4, a:"Ayette birr; iman, ibadet, sosyal ahlak (ahde vefa) ve bireysel ahlak (sabır) olmak üzere dört boyutta anlatılır. Siyasi güç bu boyutlardan değildir."},
{z:1, s:"Bir toplumda bireyler yalnızca kendi çıkarını düşünse, verdiği sözde durmasa ve zor durumdaki komşusuna yardım etmese, o toplumda zamanla güven ve dayanışma ortadan kalkar. Bu durum ünitede işlenen hangi kavramla doğrudan ilişkilidir?", o:["İmanın taklidî oluşu","İmanın topluma kazandırdıkları","Meleklerin görevleri","Kader-kaza ilişkisi","Selbî sıfatlar"], d:1, a:"Parçadaki güven, dayanışma ve söz tutma vurgusu, imanın topluma kazandırdıklarıyla (birlik, adalet, yardımlaşma) doğrudan ilişkilidir."},
{z:0, s:"'Lâ ilâhe illallah' ifadesi öncelikle hangi kavramla ilişkilidir?", o:["Şirk","Tevhit","Nübüvvet","Amentü","Takva"], d:1, a:"Kelime-i tevhit, Allah'tan başka ilah olmadığını bildirerek tevhidi ifade eder."}
];

const q = document.getElementById('quiz');
q.innerHTML = SORULAR.map(function(item,i){
  var opts = item.o.map(function(op,j){
    var harf = "ABCDE"[j];
    return '<label class="opt" data-i="'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> <b>'+harf+')</b> '+op+'</label>';
  }).join('');
  return '<div class="quiz-q" data-d="'+item.d+'">'+
    '<div class="qh"><span class="qn">'+(i+1)+'</span><span>'+item.s+(item.z? '<span class="zortag">ZOR</span>':'')+'</span></div>'+
    opts+
    '<div class="qexp">'+item.a+'</div>'+
  '</div>';
}).join('');

document.getElementById('btnBitir').addEventListener('click', function(){
  var qs = document.querySelectorAll('.quiz-q');
  var dogru = 0;
  qs.forEach(function(el){
    var d = parseInt(el.getAttribute('data-d'),10);
    var secili = el.querySelector('input:checked');
    var opts = el.querySelectorAll('.opt');
    opts.forEach(function(o,i){
      if(i===d) o.classList.add('correct');
      if(secili && parseInt(secili.value,10)===i && i!==d) o.classList.add('wrong');
    });
    if(secili && parseInt(secili.value,10)===d) dogru++;
    el.querySelector('.qexp').classList.add('show');
  });
  document.getElementById('score').textContent = 'Sonuç: '+dogru+' / '+qs.length;
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>

</body>
</html>
