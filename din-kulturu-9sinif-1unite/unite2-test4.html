<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2. Ünite — Test 4 | İslam'da İnanç Esasları</title>
<style>
:root{
  --ink:#17242e; --ink2:#41525f; --bg:#f6f4ef; --card:#ffffff;
  --line:#e3ddd2; --teal:#0f6f66; --teal-soft:#e6f2f0;
  --blue:#1e5a8a; --blue-soft:#e8f1f8;
  --green:#3c6b2f; --green-soft:#ecf4e8;
  --red:#a33a34; --red-soft:#fbeceb;
  --amber:#a4610b; --amber-soft:#fbf1e2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}
a{color:var(--teal)}
header.hero{background:linear-gradient(160deg,#0f6f66 0%,#134e5e 60%,#173a4a 100%);color:#fff;padding:34px 20px 30px;margin-bottom:22px}
header.hero .inner{max-width:760px;margin:0 auto}
.kicker{letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;opacity:.82;margin:0 0 8px}
header.hero h1{margin:0 0 8px;font-size:clamp(21px,4vw,28px)}
header.hero p{margin:0;opacity:.92;font-size:14.5px}
.zortag{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.top-back{max-width:760px;margin:14px auto 0;padding:0 20px}
.top-back a{display:inline-flex;gap:6px;color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:650}
.quiz-q{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:14px 0}
.quiz-q .qh{font-weight:650;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start}
.quiz-q .qn{background:var(--blue);color:#fff;border-radius:7px;padding:1px 9px;font-size:13px;height:fit-content;flex:none;margin-top:2px}
.opt{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:5px 0;cursor:pointer;font-size:15px;transition:.12s}
.opt:hover{background:#f2f7fb;border-color:#b9d3e6}
.opt input{margin-right:8px}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.qexp{display:none;margin-top:10px;padding:10px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 9px 9px 0;font-size:14.4px}
.qexp.show{display:block}
.quiz-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0;background:linear-gradient(180deg,rgba(246,244,239,0),var(--bg) 30%)}
button.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
button.btn:hover{background:#0c5b53}
#score{font-weight:750;font-size:16px;background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:10px}
</style>
</head>
<body>

<div class="top-back"><a href="unite2.html">← Konuya Dön</a></div>

<header class="hero">
  <div class="inner">
    <p class="kicker">Din Kültürü ve Ahlak Bilgisi · 2. Ünite · Test 4/4</p>
    <h1>İslam'da İnanç Esasları — Test 4</h1>
    <p>20 soru · 5 seçenekli · TYT/AYT formatı. Kırmızı etiketli sorular daha zorlayıcıdır.</p>
  </div>
</header>

<div class="wrap">
  <div id="quiz"></div>
  <div class="quiz-bar">
    <button class="btn" id="btnBitir">Sonuçları Gör</button>
    <span id="score"></span>
  </div>
</div>

<script>
const SORULAR = [
{z:0, s:"Amentü kaç iman esasını özetler?", o:["4","5","6","7","8"], d:2, a:"Amentü, altı iman esasını (Allah, melekler, kitaplar, peygamberler, ahiret, kader-kaza) özetler."},
{z:0, s:"'Mümin' kelimesi büyük harfle (el-Mü'min) yazıldığında neyi ifade eder?", o:["İman eden kişi","Allah'ın bir ismi","Bir meleğin adı","Bir kitabın adı","Bir peygamberin sıfatı"], d:1, a:"el-Mü'min, Allah'ın esmâ-i hüsnâsından biridir: emin kılan, güvene kavuşturan."},
{z:0, s:"Tahkikî imanın kaynağı nedir?", o:["Çevrenin taklidi","Tefekkür, Kur'an ve sünnet yoluyla bilgi","Sadece aklî delil","Sadece naklî delil","Hiçbiri"], d:1, a:"Tahkikî iman; tefekkür ile Kur'an ve sünnet yoluyla edinilen bilgiye, hem naklî hem aklî delillere dayanır."},
{z:1, s:"Bir kişi, çevresindeki insanların inandığı gibi inanmakta; ancak son zamanlarda kendi kendine araştırmaya, delil aramaya başlamıştır. Bu kişi hangi süreci yaşamaktadır?", o:["Tahkikîden taklidîye geçiş","Taklidîden tahkikîye geçiş","İmandan küfre geçiş","İkrardan tasdike geçiş","Şirkten tevhide geçiş"], d:1, a:"Araştırmaya, delil aramaya başlamak; taklidî imandan tahkikî imana geçişin işaretidir."},
{z:0, s:"Hafaza melekleri hangi görevi üstlenir?", o:["Kabirde sorgu","İnsanı önünden ve arkasından koruma","Sûra üfleme","Rızıkları yönetme","Vahiy taşıma"], d:1, a:"Hafaza melekleri, insanın önünde ve arkasında bulunup onu koruyan meleklerdir."},
{z:0, s:"'İsrâfil' hangi görevle bilinir?", o:["Vahiy taşıma","Rızıkları yönetme","Sûra üfleme","Ruh alma","Arşı taşıma"], d:2, a:"İsrâfil, sûra üflemekle görevlidir; birinci üfleyişte kıyamet, ikinci üfleyişte diriliş gerçekleşir."},
{z:1, s:"Bir kişi, İncil'i Hz. Îsâ'ya indirildiği hâliyle değil, günümüzdeki hâliyle kabul etmektedir. Bu tutum, kitaplara imanla ilgili hangi ilkeyle çelişir?", o:["Kitaplara iman, kitapların günümüzdeki hâline değil indirildikleri hâline imandır","Kitaplara iman şart değildir","Yalnızca Kur'an'a iman yeterlidir","İncil iman esasları arasında yer almaz","Hiçbiri"], d:0, a:"Kitaplara iman, ilahi kitapların indirildikleri hâline imanı gerektirir; günümüze ulaşan metinlerin bire bir aynı olduğu iddiası yalnızca Kur'an için geçerlidir."},
{z:0, s:"Peygamberlerin günahtan korunmuş olması hangi sıfatla ifade edilir?", o:["Sıdk","Emanet","Fetanet","Tebliğ","İsmet"], d:4, a:"İsmet, peygamberlerin günahtan korunmuş olması sıfatıdır."},
{z:0, s:"Kur'an'da kaç peygamberin adı geçer?", o:["20","25","30","33","40"], d:1, a:"Kur'an'da 25 peygamberin adı geçer."},
{z:1, s:"Sınıfta bir öğrenci arkadaşının eşyasını izinsiz almasına rağmen kimse görmediği için rahatsızlık duymuyor; başka bir öğrenci ise kimse görmese de bunun yanlış olduğunu düşünüp arkadaşının eşyasına dokunmuyor. İkinci öğrencinin tutumu imanın hangi kazanımıyla açıklanabilir?", o:["Taklidî iman","Ahiret bilinciyle gelişen ahlaki süreklilik (takva)","Meleklere iman","Kitaplara iman","Şirkten uzak durma"], d:1, a:"Görülmese de doğru davranmak, ahiret bilincinin (takva) ahlakı sürekli kıldığının somut bir örneğidir."},
{z:0, s:"Ahiret hayatının ilk aşaması hangisidir?", o:["Kıyamet","Ölüm","Kabir hayatı","Haşir","Hesap"], d:1, a:"Ölüm, insan hayatının sona ermesiyle ahiret hayatının ilk aşamasıdır."},
{z:0, s:"'Şüphesiz biz her şeyi bir ölçüye göre yarattık' ayeti hangi iman esasıyla ilgilidir?", o:["Meleklere iman","Kitaplara iman","Kadere iman","Ahirete iman","Peygamberlere iman"], d:2, a:"Kamer 54/49, kader inancıyla ilgili temel ayetlerden biridir."},
{z:1, s:"Bir ayet önce 'iyilik yüzünüzü doğu-batıya çevirmeniz değildir' diyerek başlar. Ayetin bu girişinin amacı nedir?", o:["Namazın önemsiz olduğunu vurgulamak","İyiliğin sadece şekilden ibaret olmadığını, öz ve bütünlük gerektirdiğini vurgulamak","Kıblenin değiştiğini bildirmek","Yönlerin önemsiz olduğunu söylemek","Hiçbiri"], d:1, a:"Bakara 2/177'nin girişi, iyiliğin dış görünüş/şekilden ibaret olmadığını, iman-ibadet-ahlakın bütünü olduğunu vurgular."},
{z:0, s:"Selbî sıfatların sayısı kaçtır?", o:["5","6","7","8","9"], d:1, a:"Selbî (tenzîhî) sıfatlar 6 tanedir: vücûd, kıdem, bekā, vahdâniyet, muhâlefetün li'l-havâdis, kıyâm bi-nefsihî."},
{z:0, s:"'Allah'ın her şeyi yaratması' hangi sıfatla ifade edilir?", o:["İlim","İrade","Tekvîn","Kelâm","Kudret"], d:2, a:"Tekvîn, Allah'ın her şeyi yaratmasını ifade eder."},
{z:1, s:"Bir kişi; Allah'a, meleklere, kitaplara ve peygamberlere inandığını, fakat öldükten sonra hiçbir hayatın olmadığını düşündüğünü söylüyor. Bu kişinin durumu için ne söylenebilir?", o:["Mümin sayılır çünkü çoğu esasa inanmaktadır","İman esasları bir bütün olduğundan iman etmiş sayılmaz","Taklidî iman sahibidir","Tahkikî iman sahibidir","Yalnızca ahireti reddettiği için sorun yoktur"], d:1, a:"İman esasları bölünmez bir bütündür; ahireti reddeden kişi diğer esaslara inansa da iman etmiş sayılmaz."},
{z:0, s:"'Kelime-i şehadet, namaz, zekât, oruç, hac' hangi kavramın unsurlarıdır?", o:["İman esasları","İslam'ın şartları","İhsan","Amentü","Birr"], d:1, a:"Bu beş unsur İslam'ın şartlarıdır; iman esaslarından (amentü) farklıdır."},
{z:0, s:"Zekât ve namaz, Bakara 177'de birr'in hangi boyutuna girer?", o:["İman","İbadet","Sosyal ahlak","Bireysel ahlak","Tevekkül"], d:1, a:"Namaz ve zekât, ayette 'ibadet' boyutuna örnek gösterilir."},
{z:1, s:"Bir toplumda insanlar sıkıntı, hastalık ve savaş zamanlarında sabretmeyi bir erdem olarak görmese, bu durum Bakara 177'nin hangi boyutunun eksik yaşanmasına örnek olur?", o:["İman","İbadet","Sosyal ahlak","Bireysel ahlak","Tevhit"], d:3, a:"Sıkıntı, hastalık ve savaşta sabretmek ayette bireysel ahlak boyutuna örnektir."},
{z:0, s:"Allah'ın yaratılmışlara hiçbir yönden benzememesi hangi sıfatla ifade edilir?", o:["Vahdâniyet","Muhâlefetün li'l-havâdis","Kıyâm bi-nefsihî","Kıdem","Bekā"], d:1, a:"Muhâlefetün li'l-havâdis, Allah'ın yaratılmışlara benzememesini ifade eden selbî bir sıfattır."}
];

const q = document.getElementById('quiz');
q.innerHTML = SORULAR.map(function(item,i){
  var opts = item.o.map(function(op,j){
    var harf = "ABCDE"[j];
    return '<label class="opt" data-i="'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> <b>'+harf+')</b> '+op+'</label>';
  }).join('');
  return '<div class="quiz-q" data-d="'+item.d+'">'+
    '<div class="qh"><span class="qn">'+(i+1)+'</span><span>'+item.s+(item.z? '<span class="zortag">ZOR</span>':'')+'</span></div>'+
    opts+
    '<div class="qexp">'+item.a+'</div>'+
  '</div>';
}).join('');

document.getElementById('btnBitir').addEventListener('click', function(){
  var qs = document.querySelectorAll('.quiz-q');
  var dogru = 0;
  qs.forEach(function(el){
    var d = parseInt(el.getAttribute('data-d'),10);
    var secili = el.querySelector('input:checked');
    var opts = el.querySelectorAll('.opt');
    opts.forEach(function(o,i){
      if(i===d) o.classList.add('correct');
      if(secili && parseInt(secili.value,10)===i && i!==d) o.classList.add('wrong');
    });
    if(secili && parseInt(secili.value,10)===d) dogru++;
    el.querySelector('.qexp').classList.add('show');
  });
  document.getElementById('score').textContent = 'Sonuç: '+dogru+' / '+qs.length;
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>

</body>
</html>
