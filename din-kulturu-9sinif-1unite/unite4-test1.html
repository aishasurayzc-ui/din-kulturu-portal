<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4. Ünite — Test 1 | İslam'da Ahlak İlkeleri — 9. Sınıf DKAB</title>
<style>
:root{
  --ink:#17242e; --ink2:#41525f; --bg:#f6f4ef; --card:#ffffff;
  --line:#e3ddd2; --teal:#0f6f66; --teal-soft:#e6f2f0;
  --blue:#1e5a8a; --blue-soft:#e8f1f8;
  --green:#2f6b2f; --green-soft:#eaf4ea;
  --red:#a33a34; --red-soft:#fbeceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.62;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:20px 18px 90px}
a.geri{display:inline-block;margin-bottom:14px;font-size:14px;font-weight:650;color:var(--teal);text-decoration:none}
header.hero{background:linear-gradient(160deg,#0f6f66 0%,#134e5e 60%,#173a4a 100%);color:#fff;padding:26px 22px;border-radius:16px;margin-bottom:22px}
header.hero .kicker{letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;opacity:.82;margin:0 0 6px}
header.hero h1{margin:0 0 6px;font-size:22px}
header.hero p{margin:0;opacity:.92;font-size:14px}
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:14px 0}
.quiz-q.hard{border-left:4px solid var(--blue)}
.qh{font-weight:650;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start}
.qn{background:var(--teal);color:#fff;border-radius:7px;padding:1px 9px;font-size:13px;flex:none}
.qh.hard .qn{background:var(--blue)}
.qtag{font-size:11px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 9px;font-weight:700;margin-left:auto;white-space:nowrap}
.qtext{font-size:15.3px}
.opt{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:6px 0 0;cursor:pointer;font-size:15px}
.opt:hover{background:#f4f2ec}
.opt input{margin-right:8px}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.qexp{display:none;margin-top:10px;padding:10px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 9px 9px 0;font-size:14.3px}
.qexp.show{display:block}
.quiz-bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:rgba(246,244,239,.95);backdrop-filter:blur(6px);padding:14px 0;border-top:1px solid var(--line);margin-top:10px}
button.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
button.btn:hover{background:#0c5b53}
#score{font-weight:700;font-size:15.5px}
.testnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.testnav a{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink2)}
.testnav a.aktif{background:var(--teal);color:#fff;border-color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <a class="geri" href="unite4.html">← Konuya Dön</a>
  <header class="hero">
    <p class="kicker">9. Sınıf DKAB · 4. Ünite · İslam'da Ahlak İlkeleri</p>
    <h1>Test 1</h1>
    <p>20 soru · 5 seçenekli · TYT/AYT formatında karışık zorlukta test</p>
  </header>
  <div class="testnav">
    <a class="aktif" href="unite4-test1.html">Test 1</a>
    <a href="unite4-test2.html">Test 2</a>
    <a href="unite4-test3.html">Test 3</a>
    <a href="unite4-test4.html">Test 4</a>
  </div>
  <div id="quiz"></div>
  <div class="quiz-bar">
    <button class="btn" onclick="degerlendir()">Sonuçları Gör</button>
    <span id="score"></span>
  </div>
</div>
<script>
const SORULAR = [
{q:"Aşağıdakilerden hangisi ahlakın tanımında yer almaz?",opts:["İnsanın iyi veya kötü olarak nitelenmesine yol açan huylar","İradeyle ortaya konan davranışların bütünü","Kişinin doğuştan sahip olduğu, hiçbir şekilde değişmeyen özellikler","Manevi nitelikler","Karakter yapısı"],c:2,exp:"Ahlak, terbiye ile değişebilen bir özelliktir; 'hiçbir şekilde değişmeyen' ifadesi ders kitabındaki tanımla çelişir.",hard:false},
{q:"İslam'a göre ahlakın asıl kaynağı aşağıdakilerden hangisidir?",opts:["Toplumun örf ve âdetleri","Bireyin kişisel tercihleri","Allah","Filozofların görüşleri","Kanunlar"],c:2,exp:"Metinde açıkça 'İslam'a göre ahlakın asıl kaynağı Allah'tır' denir; Kur'an ve sünnet bu kaynağı açıklayan temel metinlerdir.",hard:false},
{q:"Akıl, irade ve vicdanın ahlaktaki ortak işlevi nedir?",opts:["Kişiyi toplumdan tamamen bağımsızlaştırmak","İyiyi kötüden ayırma, doğru olana yönelme ve öz denetim sağlama","Yalnızca ibadetleri düzenlemek","Ekonomik kazancı artırmak","Gelenekleri değiştirmek"],c:1,exp:"Akıl iyi-kötüyü ayırt eder, irade doğru olana yönelmeyi seçer, vicdan öz denetim sağlar — üçü birlikte ahlaka kaynaklık eder.",hard:false},
{q:"'Terbiye' kavramı, Allah'ın hangi ismiyle ilişkilendirilir?",opts:["Rahman","Rab","Kerim","Gafûr","Vedûd"],c:1,exp:"Terbiye kelimesi, anlamlarından biri 'terbiye eden' olan Rab ismiyle aynı köktendir.",hard:false},
{q:"\"İnsan bazı huy ve eğilimlerle dünyaya gelir; fakat bunlar aile, eğitim, çevre ve yaşam tecrübeleriyle biçimlenir.\" Bu parçaya göre aşağıdakilerden hangisi söylenemez?",opts:["Ahlak, doğuştan gelen bir yönü olsa da sabit değildir.","Eğitim, ahlaki gelişimde etkilidir.","Çevre, kişinin huylarını şekillendirebilir.","Ahlak, doğduğu andan itibaren değişmeksizin sabit kalır.","Yaşam tecrübeleri kişinin huylarını etkiler."],c:3,exp:"Parça, huyların 'sabit ve değişmez olmadığını' söyler; bu nedenle 'değişmeksizin sabit kalır' ifadesi parçayla doğrudan çelişir ve söylenemez.",hard:true},
{q:"Adalet kavramının tanımı aşağıdakilerden hangisidir?",opts:["Yalnızca mahkemede verilen kararlar","Her şeyi yerli yerine koymak, dengeli ve tarafsız olmak","Herkese eşit miktar vermek","Sadece zenginlere yardım etmek","Kanunları ezbere bilmek"],c:1,exp:"Adalet; doğruluk, denge, tarafsızlık ve her şeyi yerli yerine koymaktır — eşit miktar vermekle karıştırılmamalıdır (terzi örneği).",hard:false},
{q:"Şecaat erdemi hangi iki aşırı ucun ortasında yer alır?",opts:["Cimrilik – savurganlık","Korkaklık – saldırganlık","Cahillik – bağnazlık","Hazcılık – çilecilik","Kibir – zillet"],c:1,exp:"Şecaat, korkaklık (eksik uç) ile saldırganlık (aşırı uç) arasındaki ölçülü cesarettir.",hard:false},
{q:"İffetin özü olarak nitelendirilen kavram aşağıdakilerden hangisidir?",opts:["Hikmet","Hayâ","Şecaat","İtidal","Sabır"],c:1,exp:"Hadiste 'İslam ahlakının özü hayâdır' denir; hayâ iffetin iç bekçisi olarak tanımlanır.",hard:false},
{q:"Hikmet erdemi insanı öncelikle neden korur?",opts:["Ekonomik kayıptan","Cahilce davranış ve bağnazlıktan","Fiziksel yorgunluktan","Sosyal izolasyondan","Maddi israftan"],c:1,exp:"Hikmet, aklı iman nuruyla aydınlatarak insanı cahilce davranışlardan, bağnazlıktan ve aşırı uçlara savrulmaktan korur.",hard:false},
{q:"Bir kişi, arkadaşının haksız yere suçlandığını bildiği hâlde, tepki çekmemek için gerçeği söylemekten kaçınıyor; başka bir kişi ise aynı olayda öfkeyle ortalığı karıştırıp kavga çıkarıyor. Bu iki tutum hangi erdemin iki aşırı ucunu örnekler?",opts:["Adalet","İffet","Şecaat","Hikmet","Sabır"],c:2,exp:"Birinci tutum korkaklık, ikincisi saldırganlıktır; ikisi de şecaatin iki aşırı ucudur (korkaklık ↔ şecaat ↔ saldırganlık).",hard:true},
{q:"Dürüstlük kavramı hangi iki kavramla eş anlamlı olarak kullanılır?",opts:["Sıdk ve sadakat","Hikmet ve tevazu","İnfak ve zekât","Sabır ve rıza","Edep ve hayâ"],c:0,exp:"Dürüstlük; sıdk (doğruluk) ve sadakat kavramlarıyla ifade edilir.",hard:false},
{q:"Zekât ile sadaka arasındaki temel fark nedir?",opts:["Zekât gönüllü, sadaka zorunludur","Zekât farzdır ve belirli oranı vardır; sadaka her türlü gönüllü yardımı kapsar","İkisi de aynı anlama gelir","Sadaka yalnızca para ile yapılır","Zekât yalnızca ramazanda verilir"],c:1,exp:"Zekât, dinen zengin sayılanın malının belirli bir miktarını vermesidir ve farzdır; sadaka ise her türlü gönüllü maddi/manevi yardımı kapsar.",hard:false},
{q:"Hadiste geçen \"Güçlü kimse, insanları güreşte yenen değil, öfke anında kendisine hâkim olandır.\" ifadesi sabrın hangi alanına örnektir?",opts:["Dıştan gelen zorluklara sabır","İçten gelen dürtülere sabır","İbadette sabır","Yasaklardan kaçınmada sabır","Musibete sabır"],c:1,exp:"Öfkeye hâkim olmak, içten gelen dürtülere (arzu, öfke) karşı gösterilen sabır türüne örnektir.",hard:false},
{q:"Adabımuaşeret kavramı en doğru şekilde nasıl tanımlanır?",opts:["Yalnızca resmi törenlerde uyulan kurallar","Toplumda gelenek hâline gelmiş nezaket, terbiye ve görgü kuralları","Dinî ibadetlerin şekli","Ailenin ekonomik düzeni","Hukuki yaptırımlar bütünü"],c:1,exp:"Adabımuaşeret, toplumda benimsenerek gelenekleşmiş nezaket, terbiye, ahlak ve görgü kurallarıdır.",hard:false},
{q:"\"Ahiliğin kuralları fütüvvetname adı verilen kitaplarda yazılıdır. Bir ahide vefa, doğruluk, emniyet, cömertlik, tevazu ve affedicilik aranırken; içki, zina, yalan, gıybet ve hile meslekten atılma sebebidir.\" Bu parçadan hangisi çıkarılamaz?",opts:["Meslek ahlakı dinî ve ahlaki değerlerle ilişkilendirilmiştir.","Dürüstlük mesleği sürdürebilmenin bir şartı sayılmıştır.","Ahilik yalnızca ekonomik amaçlarla kurulmuş bir örgütlenmedir.","Esnaflık ile ahlaki olgunluk birlikte düşünülmüştür.","Ahiliğin kuralları yazılı metinlerle belirlenmiştir."],c:2,exp:"Meslekten atılma sebeplerinin ahlaki/dinî yasaklar olması, ahiliğin salt ekonomik değil öncelikle ahlak temelli bir yapı olduğunu gösterir; bu yüzden 'yalnızca ekonomik' ifadesi çıkarılamaz.",hard:true},
{q:"İsrâ suresi hangi dönemde ve nerede indirilmiştir?",opts:["Medine döneminde, hicretten sonra","Mekke döneminde, hicretten önce","Taif döneminde","Mekke'nin fethinden sonra","Veda haccı sırasında"],c:1,exp:"İsrâ suresi Mekke döneminde, hicretten önce inmiştir.",hard:false},
{q:"İsrâ 23-24. ayetlerde anne babaya karşı davranışla ilgili aşağıdakilerden hangisi geçmez?",opts:["Onlara 'öf' bile dememek","Onları azarlamamak","Gönül alıcı güzel sözler söylemek","Onlara maddi olarak bakmayı şart koşmak","Onlar için merhamet duası etmek"],c:3,exp:"Ayetlerde sayılan davranışların hepsi manevi tutumlardır (söz, üslup, dua); maddi bakım şartı ayette geçmez.",hard:false},
{q:"İsrâ 29. ayete göre harcamada doğru tutum nedir?",opts:["Elde ne varsa hemen harcamak","Ne cimri ne de ölçüsüzce eli açık olmak","Yalnızca kendi ihtiyacını düşünmek","Tüm malı sadaka olarak dağıtmak","Hiç harcama yapmamak"],c:1,exp:"Ayet, 'eli sıkı olma, ölçüsüzce eli açık da olma' diyerek cimrilik ile israf arasında dengeyi (cömertliği) öğütler.",hard:false},
{q:"\"Rabbin sadece kendisine kulluk etmenizi ve anne babanıza iyi davranmanızı emretti...\" ayetinin kurgusuyla ilgili aşağıdakilerden hangisi söylenebilir?",opts:["Anne babaya iyilik, kulluktan bağımsız ayrı bir konudur.","Kulluk emri ile anne babaya iyilik emri aynı cümlede birlikte verilmiştir.","Ayet yalnızca ibadetten söz eder.","Anne baba hakkı ayette ikinci planda bırakılmıştır.","Ayet sadece gençleri muhatap alır."],c:1,exp:"Allah'a kulluk emri ile anne babaya iyilik emrinin aynı cümlede yan yana gelmesi, anne baba hakkının İslam ahlakındaki önemini vurgular.",hard:true},
{q:"Cahiliye Dönemi ahlak anlayışı (mürüvvet) ile Kur'an ahlakı arasındaki temel fark için aşağıdakilerden hangisi söylenebilir?",opts:["Cahiliye Dönemi'nde hiçbir ahlaki erdem yoktu.","Kur'an ahlakı, cömertlik ve doğru sözlülük gibi erdemleri tamamen reddeder.","Cahiliye ahlakının dayanağı kabilecilik iken Kur'an ahlakının dayanağı tevhit ve evrensel ilkelerdir.","İkisi arasında hiçbir fark yoktur.","Kur'an ahlakı yalnızca ahiret hayatını, cahiliye ahlakı ise yalnızca ekonomik hayatı ilgilendirir."],c:2,exp:"Cahiliye ahlakı ataların gelenekleri ve kabilecilik üzerine kuruluyken, Kur'an ahlakı tevhit inancına dayanır ve kapsamı evrensel ilkelere uzanır; cömertlik gibi bazı erdemler her ikisinde de vardı ama dayanak ve kapsam farklıdır.",hard:true}
];
function render(){
  const el = document.getElementById('quiz');
  el.innerHTML = SORULAR.map(function(s,i){
    const opts = s.opts.map(function(o,j){
      return '<label class="opt" data-i="'+i+'" data-j="'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+o+'</label>';
    }).join('');
    return '<div class="quiz-q'+(s.hard?' hard':'')+'" id="qbox'+i+'">'+
      '<div class="qh'+(s.hard?' hard':'')+'"><span class="qn">'+(i+1)+'</span><span class="qtext">'+s.q+'</span>'+(s.hard?'<span class="qtag">TYT/AYT</span>':'')+'</div>'+
      opts+
      '<div class="qexp" id="qexp'+i+'"><b>Doğru cevap: '+String.fromCharCode(65+s.c)+')</b> '+s.exp+'</div>'+
    '</div>';
  }).join('');
}
function degerlendir(){
  let dogru = 0, cevapsiz = 0;
  SORULAR.forEach(function(s,i){
    const secili = document.querySelector('input[name="q'+i+'"]:checked');
    const secIdx = secili ? parseInt(secili.value,10) : -1;
    if(secIdx === -1) cevapsiz++;
    else if(secIdx === s.c) dogru++;
    document.querySelectorAll('label[data-i="'+i+'"]').forEach(function(lbl){
      const j = parseInt(lbl.getAttribute('data-j'),10);
      if(j === s.c) lbl.classList.add('correct');
      else if(j === secIdx) lbl.classList.add('wrong');
    });
    document.getElementById('qexp'+i).classList.add('show');
  });
  document.getElementById('score').textContent = 'Sonuç: '+dogru+' / '+SORULAR.length+' doğru'+(cevapsiz?' ('+cevapsiz+' boş)':'');
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
